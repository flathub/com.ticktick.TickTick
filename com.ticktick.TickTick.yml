app-id: com.ticktick.TickTick
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: ticktick

tags:
  - proprietary

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: ticktick
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 ticktick -t ${FLATPAK_DEST}/bin
      - install -Dm644 $FLATPAK_ID.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 $FLATPAK_ID.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - |
        for icon in 16 48 128; do
          install -Dm644 $FLATPAK_ID-$icon.png ${FLATPAK_DEST}/share/icons/hicolor/${icon}x${icon}/apps/$FLATPAK_ID.png
        done

      # For extra-data to be able to extract the .deb
      - install -Dm 755 /{usr,app}/bin/ar
      - cp /usr/lib/$(gcc --print-multiarch)/libbfd-*.so /app/lib
    sources:
      - type: file
        path: com.ticktick.TickTick.metainfo.xml
      - type: file
        path: com.ticktick.TickTick.desktop
      - type: extra-data
        only-arches:
          - x86_64
        filename: ticktick.deb
        url: https://download.ticktick.app/download/linux/linux_deb_x64/ticktick-8.0.11-amd64.deb
        sha256: cd7645de7da5a9d17ca53751fe088df224377ee6f19d4628e2ee65c2425dda4e
        size: 140382176
        x-checker-data:
          type: rotating-url
          url: https://ticktick.com/static/getApp/download?type=linux_deb_x64
          pattern: https://download.ticktick.app/download/linux/linux_deb_arm64/ticktick-([0-9.]+)-amd64.deb
      - type: extra-data
        only-arches:
          - aarch64
        filename: ticktick.deb
        url: https://download.ticktick.app/download/linux/linux_deb_arm64/ticktick-8.0.11-arm64.deb
        sha256: 2c48a8993d57c3fe4a62e4865c11f59603f3040235811c42e42fe3672b0fa983
        size: 135228160
        x-checker-data:
          type: rotating-url
          url: https://ticktick.com/static/getApp/download?type=linux_deb_arm64
          pattern: https://download.ticktick.app/download/linux/linux_deb_arm64/ticktick-([0-9.]+)-arm64.deb
      - type: file
        path: icons/com.ticktick.TickTick-16.png
      - type: file
        path: icons/com.ticktick.TickTick-48.png
      - type: file
        path: icons/com.ticktick.TickTick-128.png
      - type: script
        dest-filename: apply_extra
        commands:
          - LC_ALL=C bsdtar -xf ticktick.deb 'data.tar*'
          - rm ticktick.deb
          - tar -xf data.tar.xz --strip-components=1 ./opt/TickTick
          - tar -xf data.tar.xz --strip-components=2 ./usr
      - type: script
        dest-filename: ticktick
        commands:
          - export TMPDIR=$XDG_RUNTIME_DIR/app/$FLATPAK_ID
          - TMPDIR=$XDG_CACHE_HOME zypak-wrapper /app/extra/opt/TickTick/ticktick
            "$@"
